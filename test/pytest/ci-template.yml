# Child-pipeline job template for hls4ml pytest (GitLab mirror on CERN runners).
# Image: fdf2026 poster pipeline (conda, Vitis 2024.1, Bambu PandA, oneAPI).
# Runs the full pytest suite generated by generate_ci_yaml.py — Vivado, Vitis,
# Bambu, BambuAccelerator, Catapult, etc. (no backend filter).

.pytest:
  stage: test
  image: gitlab-registry.cern.ch/edge-spaice-private/fdf2026-bambu-hls4ml:latest
  tags:
    - corellia
  variables:
    CONDA_ENV: "hls4ml-testing"
    EXTRA_DEPS: "[da,testing,sr,optimization]"
    BAMBU_APPIMAGE: /opt/panda/bin/bambu.ginevra2-new.AppImage
    BAMBU_INSTALL_DIR: .bambu-squashfs
    USE_BAMBU_AC_TYPES: "1"
    USE_BAMBU_ARRAY_PARTITION: "1"
  before_script:
    - source /home/hls4ml/miniforge/etc/profile.d/conda.sh
    - conda activate "$CONDA_ENV"
    - setup-bambu.sh
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git submodule update --init --recursive hls4ml/templates/catapult/
    - git submodule update --init --recursive hls4ml/templates/bambu/
    - if [ "$EXAMPLEMODEL" = "1" ]; then git submodule update --init example-models; fi
    - pip install ".${EXTRA_DEPS}"

    # Vivado HLS via CERN cvmfs (version from generate_ci_yaml.py → VIVADO_VERSION)
    - mkdir -p "cmd_vivado_${VIVADO_VERSION}"
    - echo '#!/bin/bash' > "cmd_vivado_${VIVADO_VERSION}/vivado_hls"
    - echo "apptainer exec --cleanenv --env LANG=C,LC_ALL=C /cvmfs/projects.cern.ch/hls4ml/vivado/${VIVADO_VERSION} vivado_hls \"\$@\"" >> "cmd_vivado_${VIVADO_VERSION}/vivado_hls"
    - chmod +x "cmd_vivado_${VIVADO_VERSION}/vivado_hls"
    - export PATH="$PWD/cmd_vivado_${VIVADO_VERSION}:$PATH"

    # Vitis: native install in image + cvmfs wrapper (VITIS_VERSION, default 2024.1)
    - source /opt/Xilinx/Vitis/${VITIS_VERSION}/settings64.sh
    - mkdir -p "cmd_vitis_${VITIS_VERSION}"
    - echo '#!/bin/bash' > "cmd_vitis_${VITIS_VERSION}/vitis-run"
    - echo "apptainer exec /cvmfs/projects.cern.ch/hls4ml/vitis/${VITIS_VERSION} vitis-run \"\$@\"" >> "cmd_vitis_${VITIS_VERSION}/vitis-run"
    - chmod +x "cmd_vitis_${VITIS_VERSION}/vitis-run"
    - export PATH="$PWD/cmd_vitis_${VITIS_VERSION}:$PATH"

    - source /opt/intel/oneapi/setvars.sh --force
  script:
    - cd "$CI_PROJECT_DIR/test/pytest"
    - pytest $PYTESTFILE -rA --cov-report xml --cov-report term --cov=hls4ml --junitxml=report.xml --randomly-seed=42 --randomly-dont-reorganize --randomly-dont-reset-seed
  artifacts:
    when: always
    reports:
      junit:
        - test/pytest/report.xml
      coverage_report:
        coverage_format: cobertura
        path: test/pytest/coverage.xml
    paths:
      - test/pytest/*.tar.gz
      - test/pytest/synthesis_report_*.json

.pytest-keras3-only:
  extends: .pytest
  variables:
    CONDA_ENV: "hls4ml-testing-keras3"
    EXTRA_DEPS: "[da,testing,testing-keras3,sr]"
